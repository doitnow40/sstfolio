name: SSTfolio v2 Price Collector

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '수집 모드'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - sync
          - kr
          - us
          - emergency_full
  # v2 검증 중에는 v1과 이중 수집되지 않도록 schedule을 비활성 상태로 배포한다.
  # 운영 전환 시 아래 5줄의 주석을 제거한다.
  # schedule:
  #   - cron: '2-57/5 0-7 * * 1-5'
  #   - cron: '2-57/5 13-21 * * 1-5'

permissions:
  contents: read

concurrency:
  group: sstfolio-v2-price-fetch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      FETCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
      PUBLISH_MIN_SUCCESS_RATE: '95'
      STALE_MINUTES: '15'
      CLOSED_STALE_DAYS: '10'
      KR_CONCURRENCY: '8'
      US_CONCURRENCY: '6'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in GAS_WEBAPP_URL CF_ACCOUNT_ID CF_API_TOKEN CF_KV_NAMESPACE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is missing"
              exit 1
            fi
          done

      - name: Collect and publish prices
        run: python scripts/fetch_naver.py
