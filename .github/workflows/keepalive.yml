# .github/workflows/keepalive.yml
#
# 저장소 무활동 60일 → 예약(cron) 워크플로 자동 비활성화 방지
# 매월 1일·15일에 fetch-realtime.yml(과 이 워크플로 자신)을 API로 재활성화한다.
# 커밋을 만들지 않으므로 git 히스토리가 지저분해지지 않는다.

name: Keepalive

on:
  schedule:
    - cron: '17 3 1,15 * *'   # 매월 1일·15일 03:17 UTC (KST 12:17)
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Re-enable workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable fetch-realtime.yml --repo "${{ github.repository }}"
          gh workflow enable keepalive.yml      --repo "${{ github.repository }}"
          echo "re-enabled at $(date -u +%FT%TZ)"

      # ── 대안(백업): 위 방식으로 부족하면 아래 주석을 풀어 빈 커밋을 만든다.
      #    이 경우 permissions에 contents: write 를 추가하고,
      #    위 step 앞에 actions/checkout@v4 step 이 필요하다.
      # - name: Empty commit
      #   run: |
      #     git config user.name  "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git commit --allow-empty -m "chore: keepalive"
      #     git push
